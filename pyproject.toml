[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-simulation"
version = "0.2.0"
description = "A lightweight 2D physics evolutionary laboratory combining genetic algorithms, CPG rhythms, and real-time browser telemetry."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pymunk>=6.0.0",
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
evolution-train = "main:main"

[tool.setuptools]
py-modules = ["app", "main", "plot_logs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["spinningup"]
